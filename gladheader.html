<header id="glad-header">
  <div class="glad-inner">
    <a
      href="https://www.gladtech.io/"
      class="glad-logo"
      aria-label="GLAD Technology"
    >
      <img
        src="https://images.squarespace-cdn.com/content/v1/67703dfc1c33ac649aba3b8e/80cf8bc9-38fb-4d52-84ab-95fb7bb5629e/GLAD+Digital+Services+Logo.png?format=1500w"
        alt="GLAD Technology Digital Services"
      />
    </a>
    <a href="https://www.gladtech.io/" class="glad-back-btn">
      <svg
        viewBox="0 0 24 24"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        stroke="#fff"
        stroke-width="2.2"
        width="14"
        height="14"
      >
        <path d="M19 12H5M12 5l-7 7 7 7" />
      </svg>
      <span class="btn-label">Back to Main Site</span>
    </a>
  </div>
</header>

<style>
  #glad-header {
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 3200;
    transition:
      transform 0.3s ease,
      opacity 0.3s ease;
  }
  #glad-header.hidden {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
  }
  .calbcc-header.glad-hidden {
    top: 0;
  }
  .glad-inner {
    position: relative;
    max-width: var(--shell-max);
    margin: 0 auto;
    padding: 0 var(--gutter);
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  /* PERFECT CENTER */
  .glad-logo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .glad-logo img {
    height: 36px;
    width: auto;
    display: block;
  }
  .glad-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 16px;
    background: #1e3a6e;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    border-radius: 100px;
    text-decoration: none;
    border: 1.5px solid #1e3a6e;
    transition:
      background 0.2s,
      transform 0.2s;
    white-space: nowrap;
    margin-right: 40px !important;
  }
  .glad-back-btn:hover {
    background: #142d57;
    border-color: #142d57;
    transform: translateX(-2px);
  }
  @media (max-width: 480px) {
    .btn-label {
      display: none;
    }
    .glad-back-btn {
      padding: 7px 10px;
    }
  }

  /* ─── MOBILE: glad-header responsive fix (≤640px) ──────────── */
  @media (max-width: 640px) {
    .glad-inner {
      padding-left: 16px !important;
      padding-right: 16px !important;
    }
    .glad-logo img {
      margin-left: 0 !important;
    }
    .glad-back-btn {
      margin-right: 0 !important;
    }
  }

  /* ─── MOBILE: glad-header logo size fix (≤640px) ─── */
  @media (max-width: 640px) {
    .glad-logo img { height: 28px !important; width: auto !important; }
  }
</style>

<script>
  //glad header
  const gladHeader = document.getElementById("glad-header");
  const calbccHeader = document.querySelector(".calbcc-header");
  let lastScrollY = window.scrollY,
    gladVisible = true;
  window.addEventListener(
    "scroll",
    () => {
      const y = window.scrollY;
      if (y > 80 && y > lastScrollY) {
        if (gladVisible) {
          gladHeader.classList.add("hidden");
          gladVisible = false;
        }
      } else if (y < lastScrollY && y < 40) {
        if (!gladVisible) {
          gladHeader.classList.remove("hidden");
          gladVisible = true;
        }
      }
      lastScrollY = y;
    },
    { passive: true },
  );
  //
</script>
